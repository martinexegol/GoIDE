<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gopherBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29D2FE"/>
      <stop offset="100%" stop-color="#00ADD8"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#00ADD8" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Subtle circuit grid lines -->
  <path d="M60 160 H452 M60 256 H452 M60 352 H452 M160 60 V452 M256 60 V452 M352 60 V452" stroke="#00ADD8" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Gopher / Go IDE Badge -->
  <!-- Main Gopher Silhouette Head & Ears -->
  <g transform="translate(100, 100) scale(0.61)">
    <!-- Ears -->
    <ellipse cx="140" cy="90" rx="36" ry="50" fill="url(#gopherBlue)"/>
    <ellipse cx="140" cy="90" rx="20" ry="30" fill="#fbcfe8"/>
    <ellipse cx="372" cy="90" rx="36" ry="50" fill="url(#gopherBlue)"/>
    <ellipse cx="372" cy="90" rx="20" ry="30" fill="#fbcfe8"/>

    <!-- Head & Body -->
    <ellipse cx="256" cy="270" rx="170" ry="190" fill="url(#gopherBlue)"/>

    <!-- Big Curious Eyes (Characteristic Go Gopher) -->
    <ellipse cx="190" cy="210" rx="46" ry="54" fill="#ffffff"/>
    <ellipse cx="322" cy="210" rx="46" ry="54" fill="#ffffff"/>
    <circle cx="204" cy="210" r="22" fill="#0f172a"/>
    <circle cx="212" cy="202" r="7" fill="#ffffff"/>
    <circle cx="336" cy="210" r="22" fill="#0f172a"/>
    <circle cx="344" cy="202" r="7" fill="#ffffff"/>

    <!-- Snout & Nose -->
    <ellipse cx="256" cy="285" rx="38" ry="28" fill="#e0f2fe"/>
    <ellipse cx="256" cy="265" rx="18" ry="12" fill="#0f172a"/>

    <!-- Teeth -->
    <rect x="242" y="295" width="12" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="258" y="295" width="12" height="22" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Code Bracket / Terminal Prompt Overlay -->
  <g transform="translate(48, 360)">
    <rect x="0" y="0" width="416" height="88" rx="20" fill="#020617" fill-opacity="0.9" stroke="#00ADD8" stroke-width="3"/>
    <!-- Terminal dots -->
    <circle cx="24" cy="44" r="6" fill="#ef4444"/>
    <circle cx="44" cy="44" r="6" fill="#f59e0b"/>
    <circle cx="64" cy="44" r="6" fill="#10b981"/>
    <!-- Go text / prompt -->
    <text x="96" y="52" fill="#38bdf8" font-family="'Fira Code', monospace" font-weight="700" font-size="28">go run main.go</text>
    <rect x="330" y="32" width="12" height="26" fill="#00ADD8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
